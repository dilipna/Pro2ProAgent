name: CI

# Runs on every push/PR: lint, test, build. No paid LLM calls happen here —
# that's promptfoo.yml, deliberately separate (see docs/adr/0008-*.md) so a
# routine push never burns API budget or blocks on provider availability.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check src tests tools/prototype-review/export_artifact.py

      - name: pytest
        run: uv run pytest -q --basetemp=test-evidence

      - name: Preserve process-recovery receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: protopro-recovery-${{ github.sha }}
          path: test-evidence/**/recovery-receipt.json
          if-no-files-found: warn
          retention-days: 7

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - name: Build (API unreachable — exercises the seeded-fallback contract)
        run: pnpm build

  prototype-review:
    name: Prototype browser evidence (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/prototype-review
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/prototype-review/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check reviewer rejection behavior
        run: npm test
      - name: Review handcrafted design reference (not model benchmark)
        run: node review.mjs ../../examples/decision-desk ../../test-evidence/prototype-browser ../../examples/decision-desk/scenarios.json
      - name: Preserve screenshots and behavior report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: protopro-prototype-browser-${{ github.sha }}
          path: test-evidence/prototype-browser/**
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v5

      - name: Validate Compose config
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: protopro-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: protopro-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Future: push to ghcr.io/<owner>/protopro-{api,web} on main once a
      # target deployment (see deploy/README.md) is wired to pull tagged
      # images, then flip push: true above and add registry login.

  promptfoo-config:
    name: Promptfoo config validation (schema only, no LLM calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate promptfooconfig.yaml schema
        # Pin the CLI and its compatible SDK: the floating install selected an
        # openai@7.42.0 tarball that returned 404 before validation could run.
        # `validate config` is schema-only; `validate target` would actually
        # invoke providers (real LLM calls) and belongs in promptfoo.yml
        # instead, gated on a funded key being available.
        run: npx --yes --package=promptfoo@0.124.1 --package=openai@7.41.0 promptfoo validate config -c promptfooconfig.yaml
